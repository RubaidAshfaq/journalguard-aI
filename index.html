    <script>
      // Runtime constraint: HMR is disabled in AI Studio iframe environment. Ignore WebSocket connection errors.
      window.addEventListener('error', function(e) {
        var msg = e && (e.message || (e.error && e.error.message) || '');
        if (typeof msg === 'string' && (
          msg.includes('WebSocket') ||
          msg.includes('@vite/client') ||
          msg.includes('createWebSocketModuleRunnerTransport') ||
          msg.includes('failed to connect') ||
          msg.includes('ws://') ||
          msg.includes('wss://')
        )) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && (e.reason ? (e.reason.message || String(e.reason)) : '');
        if (typeof reason === 'string' && (
          reason.includes('WebSocket') ||
          reason.includes('@vite/client') ||
          reason.includes('createWebSocketModuleRunnerTransport') ||
          reason.includes('failed to connect')
        )) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
