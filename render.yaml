services:
  - type: web
    name: journalguard-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: SCOPUS_API_KEY
        sync: false
      - key: WOS_API_KEY
        sync: false
